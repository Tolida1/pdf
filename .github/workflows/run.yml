name: Maclari Guncelle

on:
  schedule:
    - cron: '*/15 * * * *' # 15 dakikada bir otomatik çalışır
  workflow_dispatch:      # Manuel çalıştırma butonu

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Kütüphaneleri Yukle
        run: pip install cloudscraper beautifulsoup4

      - name: Botu Calistir
        run: |
          # taraftar.py dosyasını nerede olursa olsun bulup çalıştırır
          SCRIPT_PATH=$(find . -name "taraftar.py" | head -n 1)
          python "$SCRIPT_PATH"

      - name: Değişiklikleri Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Eğer JSON alt klasördeyse ana dizine çekelim, değilse hata vermesin
          find . -name "yayinlar.json" -not -path "./yayinlar.json" -exec cp {} ./yayinlar.json \; || true
          
          if [ -f "yayinlar.json" ]; then
            git add yayinlar.json
            git commit -m "Yayinlar guncellendi: $(date)" || echo "Değişiklik yok."
            git push
          else
            echo "❌ Hata: yayinlar.json oluşturulamadı!"
            exit 1
          fi
