name: Maclari Guncelle

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Kutupahaneleri Yukle
        run: pip install cloudscraper beautifulsoup4

      - name: Botu Bul ve Calistir
        run: |
          # Dosyayı bul ve çalıştır (Nerede olursa olsun)
          SCRIPT_PATH=$(find . -name "taraftar.py" | head -n 1)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "❌ HATA: taraftar.py bulunamadı!"
            exit 1
          fi
          python "$SCRIPT_PATH"
          echo "Script başarıyla çalıştı."

      - name: Degeisiklikleri Kaydet
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Eğer JSON dosyası alt klasördeyse onu ana dizine taşıyalım (isteğe bağlı)
          JSON_PATH=$(find . -name "yayinlar.json" | head -n 1)
          if [ -n "$JSON_PATH" ]; then
            cp "$JSON_PATH" ./yayinlar.json
          fi
          git add yayinlar.json
          git commit -m "Yayinlar guncellendi: $(date)" || echo "Değişiklik yok"
          git push
